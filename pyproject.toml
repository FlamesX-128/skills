[project]
name = "skills-dev"
version = "0.0.0"
description = "Shared development tooling for the skills repository."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff==0.15.20"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["skills/*/scripts"]

[tool.ruff.per-file-target-version]
"skills/golang-modular-monolith/**/*.py" = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RET",  # return cleanliness
    "PTH",  # use pathlib
    "C4",   # comprehensions
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
