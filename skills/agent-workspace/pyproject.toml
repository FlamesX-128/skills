[project]
name = "agent-workspace"
version = "0.0.0"
description = "CLI for giving each agent its own isolated git worktree."
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RET",  # return cleanliness
    "PTH",  # use pathlib
    "C4",   # comprehensions
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
