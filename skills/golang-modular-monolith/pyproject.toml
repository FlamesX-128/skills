[project]
name = "golang-modular-monolith"
version = "0.0.0"
description = "Markdown formatter for the Golang Modular Monolith repo."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RET",  # return cleanliness
    "PTH",  # use pathlib
    "C4",   # comprehensions
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
